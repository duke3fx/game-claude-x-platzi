<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f0e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="AGENT: un juego de fans protagonizado por Clawd. Hecho con Claude Code." />
    <title>AGENT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=block" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0f0f0e;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: fixed;
        inset: 0;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Touch controls (shown only on touch devices). */
      .touch {
        --btn: clamp(44px, 12.5vmin, 80px);
        --edge: max(3vmin, 12px);
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        pointer-events: none;
        color: #f0eee6;
        font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
      }
      .touch.is-on { display: block; }
      .touch-pad, .touch-button, .touch-fullscreen { pointer-events: auto; touch-action: none; }
      .touch-pad {
        position: absolute;
        left: calc(env(safe-area-inset-left) + var(--edge));
        bottom: calc(env(safe-area-inset-bottom) + var(--edge));
        width: calc(var(--btn) * 2.3);
        aspect-ratio: 1;
        border-radius: 50%;
        border: 2px solid rgba(240, 238, 230, 0.3);
        background: radial-gradient(circle, rgba(20, 20, 19, 0.2), rgba(20, 20, 19, 0.5));
      }
      .touch-arrow {
        position: absolute;
        font-size: calc(var(--btn) * 0.26);
        opacity: 0.55;
        transform: translate(-50%, -50%);
      }
      .touch-arrow.is-on { color: #d77757; opacity: 1; }
      .touch-arrow-left { left: 16%; top: 50%; }
      .touch-arrow-right { left: 84%; top: 50%; }
      .touch-arrow-up { left: 50%; top: 16%; }
      .touch-arrow-down { left: 50%; top: 84%; }
      .touch-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: calc(var(--btn) * 0.8);
        height: calc(var(--btn) * 0.8);
        margin: calc(var(--btn) * -0.4);
        border-radius: 50%;
        background: rgba(240, 238, 230, 0.28);
        border: 2px solid rgba(240, 238, 230, 0.5);
        pointer-events: none;
      }
      .touch-actions {
        position: absolute;
        right: calc(env(safe-area-inset-right) + var(--edge));
        bottom: calc(env(safe-area-inset-bottom) + var(--edge));
        width: calc(var(--btn) * 2.9);
        height: calc(var(--btn) * 2.9);
      }
      .touch-button {
        position: absolute;
        width: var(--btn);
        height: var(--btn);
        padding: 0;
        border-radius: 50%;
        border: 2px solid rgba(240, 238, 230, 0.5);
        background: rgba(20, 20, 19, 0.45);
        color: inherit;
        font: inherit;
        font-size: calc(var(--btn) * 0.19);
        line-height: 1.15;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        -webkit-backdrop-filter: blur(2px);
        backdrop-filter: blur(2px);
        transition: transform 60ms, background 60ms;
      }
      .touch-hint { font-size: 0.75em; opacity: 0.6; }
      .touch-button.is-down {
        background: rgba(215, 119, 87, 0.6);
        border-color: #d77757;
        transform: scale(0.93);
      }
      .touch-jump { left: calc(var(--btn) * 0.95); bottom: 0; border-color: rgba(237, 162, 137, 0.8); }
      .touch-attack { left: 0; top: calc(var(--btn) * 0.95); }
      .touch-dash { right: 0; top: calc(var(--btn) * 0.95); font-size: calc(var(--btn) * 0.13); }
      .touch-spell { left: calc(var(--btn) * 0.95); top: 0; }
      .touch-spell .touch-label { font-size: 1.7em; line-height: 1; }
      .touch-dance {
        left: 0;
        top: 0;
        width: calc(var(--btn) * 0.7);
        height: calc(var(--btn) * 0.7);
        font-size: calc(var(--btn) * 0.14);
      }
      .touch-fullscreen {
        position: absolute;
        right: calc(env(safe-area-inset-right) + var(--edge));
        top: calc(env(safe-area-inset-top) + 14vmin);
        width: 40px;
        height: 40px;
        border-radius: 8px;
        border: 1px solid rgba(240, 238, 230, 0.35);
        background: rgba(20, 20, 19, 0.4);
        color: #f0eee6;
        padding: 9px;
        opacity: 0.7;
      }
      .touch-fullscreen svg { display: block; width: 100%; height: 100%; }

      /* Phones held upright: the game is landscape-only. */
      .rotate {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0f0f0e;
        color: #f0eee6;
        font: 20px/1.4 "Cinzel", Georgia, serif;
        text-align: center;
      }
      .rotate::before { content: "↻"; display: block; font-size: 64px; color: #d77757; margin-bottom: 12px; }
      @media (orientation: portrait) and (pointer: coarse) and (max-aspect-ratio: 2/3) {
        .rotate { display: flex; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
